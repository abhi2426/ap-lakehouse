  - apply_to_all: {tenant_id: TEN003, source_system_id: TEN003_COUPA, entity: invoice_header, is_active: true}
    rows:
      # No company code in the source at all: TEN003 is single-entity. Literal default.
      - {source_field: null,               source_datatype: null,   canonical_field: company_code,   canonical_datatype: "STRING", transform_expr: "'MER01'", is_mandatory: true, is_primary_key: true, is_sensitive: false, default_value: "MER01"}
      # No internal document id either. The supplier's own number IS the key here,
      # which is exactly why this tenant's duplicate rate is the highest of the three.
      - {source_field: "invoice-number",   source_datatype: STRING, canonical_field: invoice_doc_id, canonical_datatype: "STRING", transform_expr: "upper(trim(`invoice-number`))", is_mandatory: true, is_primary_key: true, is_sensitive: false}
      # Australian fiscal year: July to June. fiscal_year_offset = 6 from tenant_registry.
      - {source_field: "accounting-date",  source_datatype: STRING, canonical_field: fiscal_year,    canonical_datatype: "INT", transform_expr: "CASE WHEN month(try_to_date(substr(trim(`accounting-date`),1,10),'yyyy-MM-dd')) >= 7 THEN year(try_to_date(substr(trim(`accounting-date`),1,10),'yyyy-MM-dd')) + 1 ELSE year(try_to_date(substr(trim(`accounting-date`),1,10),'yyyy-MM-dd')) END", is_mandatory: true, is_primary_key: true, is_sensitive: false}
      - {source_field: "invoice-number",   source_datatype: STRING, canonical_field: supplier_invoice_number, canonical_datatype: "STRING", transform_expr: "upper(trim(`invoice-number`))", is_mandatory: true, is_primary_key: false, is_sensitive: false}
      - {source_field: "supplier-number",  source_datatype: STRING, canonical_field: vendor_id,      canonical_datatype: "STRING", transform_expr: "upper(trim(`supplier-number`))", is_mandatory: true, is_primary_key: false, is_sensitive: false}
