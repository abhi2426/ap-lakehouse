      # Amounts arrive with thousands separators and occasional currency symbols.
      - {source_field: "total",            source_datatype: STRING, canonical_field: gross_amount,   canonical_datatype: "DECIMAL(18,2)", transform_expr: "try_cast(CASE WHEN trim(total) RLIKE '^[^0-9-]*-?[0-9]{1,3}([.][0-9]{3})+,[0-9]+[^0-9]*$' OR trim(total) RLIKE '^[^0-9-]*-?[0-9]+,[0-9]{1,2}[^0-9]*$' THEN replace(regexp_replace(trim(total),'[^0-9,\\-]',''), ',', '.') ELSE regexp_replace(trim(total),'[^0-9.\\-]','') END AS DECIMAL(18,2))", is_mandatory: true, is_primary_key: false, is_sensitive: false}
      - {source_field: "tax-amount",       source_datatype: STRING, canonical_field: tax_amount,     canonical_datatype: "DECIMAL(18,2)", transform_expr: "try_cast(CASE WHEN trim(`tax-amount`) RLIKE '^[^0-9-]*-?[0-9]{1,3}([.][0-9]{3})+,[0-9]+[^0-9]*$' OR trim(`tax-amount`) RLIKE '^[^0-9-]*-?[0-9]+,[0-9]{1,2}[^0-9]*$' THEN replace(regexp_replace(trim(`tax-amount`),'[^0-9,\\-]',''), ',', '.') ELSE regexp_replace(trim(`tax-amount`),'[^0-9.\\-]','') END AS DECIMAL(18,2))", is_mandatory: false, is_primary_key: false, is_sensitive: false}
      - {source_field: "total",            source_datatype: STRING, canonical_field: debit_credit_ind, canonical_datatype: "STRING", transform_expr: "CASE WHEN try_cast(CASE WHEN trim(total) RLIKE '^[^0-9-]*-?[0-9]{1,3}([.][0-9]{3})+,[0-9]+[^0-9]*$' OR trim(total) RLIKE '^[^0-9-]*-?[0-9]+,[0-9]{1,2}[^0-9]*$' THEN replace(regexp_replace(trim(total),'[^0-9,\\-]',''), ',', '.') ELSE regexp_replace(trim(total),'[^0-9.\\-]','') END AS DECIMAL(18,2)) < 0 THEN 'H' ELSE 'S' END", is_mandatory: true, is_primary_key: false, is_sensitive: false}
      - {source_field: "currency",         source_datatype: STRING, canonical_field: currency,       canonical_datatype: "STRING", transform_expr: "upper(coalesce(nullif(trim(currency),''),'AUD'))", is_mandatory: true, is_primary_key: false, is_sensitive: false, default_value: "AUD"}
      - {source_field: "payment-terms",    source_datatype: STRING, canonical_field: payment_terms_src, canonical_datatype: "STRING", transform_expr: "upper(trim(`payment-terms`))", is_mandatory: false, is_primary_key: false, is_sensitive: false}
      - {source_field: "on-hold",          source_datatype: STRING, canonical_field: payment_block_src, canonical_datatype: "STRING", transform_expr: "CASE WHEN lower(coalesce(trim(`on-hold`),'false')) IN ('true','yes','1') THEN 'HOLD' ELSE NULL END", is_mandatory: false, is_primary_key: false, is_sensitive: false}
      - {source_field: "invoice-type",     source_datatype: STRING, canonical_field: doc_type_src,   canonical_datatype: "STRING", transform_expr: "upper(trim(`invoice-type`))", is_mandatory: false, is_primary_key: false, is_sensitive: false}
      - {source_field: "po-number",        source_datatype: STRING, canonical_field: po_number,      canonical_datatype: "STRING", transform_expr: "nullif(upper(trim(`po-number`)),'')", is_mandatory: false, is_primary_key: false, is_sensitive: false}
      - {source_field: "source",           source_datatype: STRING, canonical_field: capture_channel,canonical_datatype: "STRING", transform_expr: "upper(coalesce(nullif(trim(source),''),'UNKNOWN'))", is_mandatory: false, is_primary_key: false, is_sensitive: false}
      - {source_field: "created-at",       source_datatype: STRING, canonical_field: capture_ts,     canonical_datatype: "TIMESTAMP", transform_expr: "try_to_timestamp(trim(`created-at`),\"yyyy-MM-dd'T'HH:mm:ss\")", is_mandatory: false, is_primary_key: false, is_sensitive: false}

