      - {source_field: "invoice-date",     source_datatype: STRING, canonical_field: invoice_date,   canonical_datatype: "DATE", transform_expr: "coalesce(try_to_date(substr(trim(`invoice-date`),1,10),'yyyy-MM-dd'), try_to_date(trim(`invoice-date`),'dd/MM/yyyy'), try_to_date(trim(`invoice-date`),'d-MMM-yyyy'))", is_mandatory: true, is_primary_key: false, is_sensitive: false}
      - {source_field: "accounting-date",  source_datatype: STRING, canonical_field: posting_date,   canonical_datatype: "DATE", transform_expr: "coalesce(try_to_date(substr(trim(`accounting-date`),1,10),'yyyy-MM-dd'), try_to_date(trim(`accounting-date`),'dd/MM/yyyy'))", is_mandatory: true, is_primary_key: false, is_sensitive: false}
