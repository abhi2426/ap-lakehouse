      - {source_field: MENGE, source_datatype: STRING, canonical_field: quantity,        canonical_datatype: "DECIMAL(18,3)", transform_expr: "try_cast(CASE WHEN trim(MENGE) RLIKE '^[^0-9-]*-?[0-9]{1,3}([.][0-9]{3})+,[0-9]+[^0-9]*$' OR trim(MENGE) RLIKE '^[^0-9-]*-?[0-9]+,[0-9]{1,2}[^0-9]*$' THEN replace(regexp_replace(trim(MENGE),'[^0-9,\\-]',''), ',', '.') ELSE regexp_replace(trim(MENGE),'[^0-9.\\-]','') END AS DECIMAL(18,3)) * CASE WHEN upper(trim(SHKZG))='H' THEN -1 ELSE 1 END", is_mandatory: true, is_primary_key: false, is_sensitive: false, ordinal: 9}
      - {source_field: MEINS, source_datatype: STRING, canonical_field: uom_src,         canonical_datatype: "STRING", transform_expr: "upper(trim(MEINS))", is_mandatory: false, is_primary_key: false, is_sensitive: false, ordinal: 10}
