  - apply_to_all: {tenant_id: TEN001, source_system_id: TEN001_SAP_PRD, entity: payment_header, is_active: true}
    rows:
      # The SAP payment key is the payment RUN plus the document: same document
      # number can legitimately recur across runs and company codes.
      - {source_field: ZBUKR, source_datatype: STRING, canonical_field: company_code,    canonical_datatype: "STRING", transform_expr: "upper(trim(ZBUKR))", is_mandatory: true, is_primary_key: true, is_sensitive: false, ordinal: 0}
      - {source_field: LAUFD, source_datatype: STRING, canonical_field: run_date,        canonical_datatype: "DATE",   transform_expr: "try_to_date(trim(LAUFD),'yyyyMMdd')", is_mandatory: true, is_primary_key: true, is_sensitive: false, ordinal: 1}
      - {source_field: LAUFI, source_datatype: STRING, canonical_field: run_id,          canonical_datatype: "STRING", transform_expr: "upper(trim(LAUFI))", is_mandatory: true, is_primary_key: true, is_sensitive: false, ordinal: 2}
      - {source_field: VBLNR, source_datatype: STRING, canonical_field: payment_doc_id,  canonical_datatype: "STRING", transform_expr: "lpad(trim(VBLNR),10,'0')", is_mandatory: true, is_primary_key: true, is_sensitive: false, ordinal: 3}
      - {source_field: GJAHR, source_datatype: STRING, canonical_field: fiscal_year,     canonical_datatype: "INT",    transform_expr: "try_cast(trim(GJAHR) AS INT)", is_mandatory: true, is_primary_key: false, is_sensitive: false, ordinal: 4}
      - {source_field: LIFNR, source_datatype: STRING, canonical_field: vendor_id,       canonical_datatype: "STRING", transform_expr: "upper(trim(LIFNR))", is_mandatory: true, is_primary_key: false, is_sensitive: false, ordinal: 5}
      - {source_field: ZALDT, source_datatype: STRING, canonical_field: payment_date,    canonical_datatype: "DATE",   transform_expr: "try_to_date(trim(ZALDT),'yyyyMMdd')", is_mandatory: true, is_primary_key: false, is_sensitive: false, ordinal: 6}
      - {source_field: RWBTR, source_datatype: STRING, canonical_field: payment_amount,  canonical_datatype: "DECIMAL(18,2)", transform_expr: "try_cast(CASE WHEN trim(RWBTR) RLIKE '^[^0-9-]*-?[0-9]{1,3}([.][0-9]{3})+,[0-9]+[^0-9]*$' OR trim(RWBTR) RLIKE '^[^0-9-]*-?[0-9]+,[0-9]{1,2}[^0-9]*$' THEN replace(regexp_replace(trim(RWBTR),'[^0-9,\\-]',''), ',', '.') ELSE regexp_replace(trim(RWBTR),'[^0-9.\\-]','') END AS DECIMAL(18,2))", is_mandatory: true, is_primary_key: false, is_sensitive: false, ordinal: 7}
      - {source_field: WAERS, source_datatype: STRING, canonical_field: currency,        canonical_datatype: "STRING", transform_expr: "upper(trim(WAERS))", is_mandatory: true, is_primary_key: false, is_sensitive: false, ordinal: 8}
      - {source_field: RZAWE, source_datatype: STRING, canonical_field: payment_method_src, canonical_datatype: "STRING", transform_expr: "upper(trim(RZAWE))", is_mandatory: false, is_primary_key: false, is_sensitive: false, ordinal: 9}
      # XVORL='X' marks a payment PROPOSAL, not a payment. Counting proposals as
      # payments is a classic way to overstate disbursement.
      - {source_field: XVORL, source_datatype: STRING, canonical_field: is_proposal,     canonical_datatype: "BOOLEAN", transform_expr: "coalesce(trim(XVORL),'') IN ('X','x')", is_mandatory: false, is_primary_key: false, is_sensitive: false, ordinal: 10}
      - {source_field: VOID_FLAG, source_datatype: STRING, canonical_field: is_void,     canonical_datatype: "BOOLEAN", transform_expr: "coalesce(trim(VOID_FLAG),'') IN ('X','x','Y')", is_mandatory: false, is_primary_key: false, is_sensitive: false, ordinal: 11}

