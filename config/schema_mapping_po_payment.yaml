      - {source_field: CURRENCY_CODE,        source_datatype: STRING, canonical_field: currency,       canonical_datatype: "STRING", transform_expr: "upper(trim(CURRENCY_CODE))", is_mandatory: true, is_primary_key: false, is_sensitive: false}
      - {source_field: PAYMENT_METHOD_CODE,  source_datatype: STRING, canonical_field: payment_method_src, canonical_datatype: "STRING", transform_expr: "upper(trim(PAYMENT_METHOD_CODE))", is_mandatory: false, is_primary_key: false, is_sensitive: false}
      - {source_field: PAYMENT_BATCH_ID,     source_datatype: STRING, canonical_field: run_id,         canonical_datatype: "STRING", transform_expr: "upper(trim(PAYMENT_BATCH_ID))", is_mandatory: false, is_primary_key: false, is_sensitive: false}
      - {source_field: CHECK_DATE,           source_datatype: STRING, canonical_field: run_date,       canonical_datatype: "DATE",   transform_expr: "try_to_date(substr(trim(CHECK_DATE),1,10),'yyyy-MM-dd')", is_mandatory: false, is_primary_key: false, is_sensitive: false}
