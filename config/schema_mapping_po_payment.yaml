      - {source_field: SHKZG, source_datatype: STRING, canonical_field: debit_credit_ind, canonical_datatype: "STRING", transform_expr: "upper(trim(SHKZG))", is_mandatory: true, is_primary_key: false, is_sensitive: false, ordinal: 14}

