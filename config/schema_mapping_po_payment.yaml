      - {source_field: VOID_DATE,            source_datatype: STRING, canonical_field: is_void,        canonical_datatype: "BOOLEAN", transform_expr: "nullif(trim(VOID_DATE),'') IS NOT NULL", is_mandatory: false, is_primary_key: false, is_sensitive: false}
      - {source_field: null,                 source_datatype: null,   canonical_field: is_proposal,    canonical_datatype: "BOOLEAN", transform_expr: "CAST(false AS BOOLEAN)", is_mandatory: false, is_primary_key: false, is_sensitive: false}

