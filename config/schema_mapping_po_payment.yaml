      - {source_field: BUDAT, source_datatype: STRING, canonical_field: receipt_date,    canonical_datatype: "DATE",   transform_expr: "try_to_date(trim(BUDAT),'yyyyMMdd')", is_mandatory: true, is_primary_key: false, is_sensitive: false, ordinal: 8}
